<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIIBE Big Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* VIIBE thermal instrument skin — coal / ember / amber / white-hot */
  :root {
    --coal: #0B0908; --ash: #16110D; --soot: #292019;
    --bone: #F4EFE6; --smoke: #A89B8C;
    --ember: #FF4D00; --amber: #FFB300; --whitehot: #FFF3D6;
    --ramp: linear-gradient(90deg, #241C16 0%, #7A2E00 30%, #E85D00 58%, #FFB300 84%, #FFF3D6 100%);
    --lvl: #E85D00; /* replaced live per level */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--coal); color: var(--bone); overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 3vh; position: relative;
  }
  #glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 72% 58% at 50% 44%, var(--lvl) 0%, transparent 62%);
    opacity: .14; transition: opacity 1.2s ease; filter: blur(2px);
  }
  #brand { font-size: 2.3vh; letter-spacing: .85em; color: var(--smoke); text-indent: .85em; }
  #brand em { font-style: normal; color: var(--ember); }
  #venue {
    font-family: 'Unbounded', sans-serif; font-weight: 600;
    font-size: 5.6vh; letter-spacing: .02em; line-height: 1.08; max-width: 90vw;
  }
  #level {
    font-family: 'Unbounded', sans-serif; font-weight: 800;
    font-size: 16vh; letter-spacing: .04em; line-height: 1;
    color: var(--lvl); text-shadow: 0 0 6vh var(--lvl);
    transition: color .8s ease, text-shadow .8s ease;
  }
  #level.electric { animation: pulse 1.15s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 6vh var(--lvl); transform: scale(1); }
    50% { text-shadow: 0 0 11vh var(--lvl), 0 0 18vh var(--lvl); transform: scale(1.025); }
  }
  #bar-wrap { width: 64vw; max-width: 1150px; }
  #bar-track {
    height: 3.2vh; border-radius: 3.2vh; background: var(--ash);
    border: 1px solid var(--soot); overflow: hidden;
  }
  #bar-fill {
    height: 100%; width: 0%; border-radius: 3.2vh;
    background: var(--ramp); background-size: 64vw 100%; background-position: left;
    box-shadow: 0 0 2.4vh var(--lvl);
    transition: width 1s cubic-bezier(.2,.8,.2,1);
  }
  /* the crowd's instruction — loudest line after the level word */
  #next {
    margin-top: 2vh; font-size: 3.4vh; letter-spacing: .1em; color: var(--bone);
  }
  #next b { color: var(--amber); font-weight: 500; }
  #next .cmd { color: var(--ember); }
  #stats { display: flex; gap: 3vw; }
  .stat {
    background: var(--ash); border: 1px solid var(--soot); border-radius: 1.8vh;
    padding: 2.2vh 3.2vw; min-width: 16vw;
  }
  .stat .n { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 5.8vh; line-height: 1.1; }
  .stat .l { font-size: 1.7vh; color: var(--smoke); letter-spacing: .2em; margin-top: .7vh; }
  .stat.watch .n { color: var(--amber); text-shadow: 0 0 3vh rgba(255,179,0,.35); }
  .stat.strata .n { color: var(--lvl); }
  /* the chase: who is above us and how far */
  #chase {
    display: none; align-items: center; gap: 1.6vw;
    background: var(--ash); border: 1px solid var(--soot); border-radius: 1.6vh;
    padding: 1.6vh 3vw; font-size: 2.4vh; letter-spacing: .12em; color: var(--smoke);
  }
  #chase.on { display: flex; }
  #chase b { color: var(--whitehot); font-weight: 500; }
  #chase .gap { color: var(--ember); font-weight: 500; }
  #chase.leading { border-color: var(--amber); }
  #chase.leading b, #chase.leading .gap { color: var(--amber); }
  #err { color: var(--ember); font-size: 2.2vh; display: none; letter-spacing: .15em; }
  #foot { position: absolute; bottom: 2.4vh; font-size: 1.7vh; color: #55493C; letter-spacing: .3em; }
  @media (prefers-reduced-motion: reduce) { #level.electric { animation: none; } }
</style>
</head>
<body>
  <div id="glow"></div>
  <div id="brand">V I I <em>B</em> E</div>
  <div id="venue">&middot;&middot;</div>
  <div id="level">DORMANT</div>
  <div id="bar-wrap">
    <div id="bar-track"><div id="bar-fill"></div></div>
    <div id="next"><span class="cmd">TAP THE REACTOR</span> &middot; CHARGE THE ROOM</div>
  </div>
  <div id="stats">
    <div class="stat"><div class="n" id="scouts">0</div><div class="l">SCOUTS IN THE ROOM</div></div>
    <div class="stat watch"><div class="n" id="watchers">0</div><div class="l">WATCHING ACROSS LAGOS</div></div>
    <div class="stat strata"><div class="n" id="strata-n">&middot;&middot;</div><div class="l">CITY ENERGY STRATA</div></div>
  </div>
  <div id="chase"></div>
  <div id="err">SIGNAL LOST &middot; RETRYING</div>
  <div id="foot">LIVE HUMAN ENERGY · VERIFIED BY SCOUTS · NEVER FAKED</div>

<script>
// Venue and event names come from venue owners and ticketing partners. Never
// put one into innerHTML without this.
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const venueId = location.pathname.split("/").filter(Boolean).pop();
const $ = id => document.getElementById(id);

async function j(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function ordinal(n) {
  const s = ["TH","ST","ND","RD"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

async function tick() {
  try {
    const [venue, surge, orbit, all] = await Promise.all([
      j(`/api/venues/${venueId}`),
      j(`/api/venues/${venueId}/surge`),
      j(`/api/venues/${venueId}/orbit`),
      j(`/api/venues`),
    ]);

    $("venue").textContent = venue.name || "";
    document.title = `VIIBE · ${venue.name}`;

    const lvl = $("level");
    lvl.textContent = surge.level_label || "DORMANT";
    lvl.classList.toggle("electric", surge.level === "electric");
    document.documentElement.style.setProperty("--lvl", surge.level_color || "#E85D00");
    $("glow").style.opacity = 0.10 + 0.22 * (surge.charge_pct || 0);

    $("bar-fill").style.width = Math.round((surge.charge_pct || 0) * 100) + "%";
    $("next").innerHTML = surge.next_level
      ? `<b>${surge.taps_to_next}</b> CHARGES TO <b>${surge.next_level}</b> · <span class="cmd">TAP THE REACTOR</span>`
      : `MAX CHARGE · <span class="cmd">THE ROOM IS THE SIGNAL</span>`;

    $("scouts").textContent = orbit.watching_present + (surge.checkin_count || 0);
    $("watchers").textContent = orbit.watching_remote;

    const ranked = (all || [])
      .filter(v => (v.city || "") === (venue.city || ""))
      .sort((a, b) => (b.current_vibe_score || 0) - (a.current_vibe_score || 0));
    const rank = ranked.findIndex(v => v.id === venueId) + 1;
    $("strata-n").textContent = rank > 0 ? ordinal(rank) : "";

    // ── The chase: the venue directly above, and the gap to close ──────────
    const chase = $("chase");
    const me = ranked[rank - 1];
    if (rank === 1 && me) {
      chase.className = "on leading";
      chase.innerHTML = "♛ <b>#1 IN LAGOS RIGHT NOW</b> · HOLD IT";
    } else if (rank > 1 && me) {
      const above = ranked[rank - 2];
      const gap = Math.max(0.1, (above.current_vibe_score || 0) - (me.current_vibe_score || 0));
      chase.className = "on";
      chase.innerHTML =
        "<span class='gap'>" + gap.toFixed(1) + " POINTS</span> BEHIND <b>" +
        esc((above.name || "").toUpperCase()) + "</b> FOR " + ordinal(rank - 1);
    } else {
      chase.className = "";
    }

    $("err").style.display = "none";
  } catch (e) {
    $("err").style.display = "block";
  }
}

tick();
setInterval(tick, 8000);
</script>
</body>
</html>
